# Installateurs de l'application de bureau.
#
# - Étiquette `v*` poussée : les installateurs sont joints à une publication
#   GitHub en brouillon, à relire puis publier à la main.
# - Lancement manuel (onglet Actions) : installateurs en artefacts seulement,
#   pour essayer avant de publier.
#
# Les paquets de mise à jour sont signés par la clé des secrets
# TAURI_SIGNING_PRIVATE_KEY et TAURI_SIGNING_PRIVATE_KEY_PASSWORD ; la
# publication porte un latest.json que l'application consulte.
#
# Voir docs/publication.md (version, signature, déploiement en entreprise).
name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bureau:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Une seule application pour les Mac Intel et Apple Silicon.
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/bureau/package-lock.json
      - name: Dépendances
        working-directory: apps/bureau
        run: npm ci
      - name: Construction (et publication en brouillon pour une étiquette)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/bureau
          args: --config src-tauri/tauri.publication.conf.json ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Correcteur ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            Correcteur libre du français : orthographe, homophones, grammaire, typographie. Tout le traitement est local.

            **macOS** (Intel et Apple Silicon) : fichier `.dmg`. **Windows** : `.msi` (déploiement en entreprise) ou `-setup.exe`. Les fichiers `.tar.gz`, `.zip`, `.sig` et `latest.json` servent aux mises à jour intégrées à l'application.

            Les installateurs ne sont pas encore signés par un certificat de développeur :
            - macOS : au premier lancement, ouvrir Réglages Système > Confidentialité et sécurité, puis « Ouvrir quand même » ;
            - Windows : SmartScreen, « Informations complémentaires » puis « Exécuter quand même ».
      - name: Installateurs
        uses: actions/upload-artifact@v4
        with:
          name: installateurs-${{ matrix.os }}
          path: |
            apps/bureau/src-tauri/target/release/bundle/msi/*.msi
            apps/bureau/src-tauri/target/release/bundle/nsis/*.exe
            apps/bureau/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
