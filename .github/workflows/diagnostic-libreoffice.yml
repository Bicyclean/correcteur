name: Diagnostic LibreOffice (Linux)

# Lancé à la main : isole la partie de l'extension qui empêche son
# installation dans LibreOffice sous Ubuntu, sans relancer toute la CI.
on:
  workflow_dispatch:

jobs:
  variantes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addins/libreoffice
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Extension complète
        run: python3 construire.py
      - name: LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer python3-uno libreoffice-script-provider-python
      - name: Installer des variantes réduites
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, tempfile, zipfile, pathlib
          complete = glob.glob("dist/*.oxt")[0]
          with zipfile.ZipFile(complete) as z:
              noms = z.namelist()
          variantes = {
              "complète": noms,
              "sans données": [n for n in noms if not n.startswith("data/")],
              "sans bibliothèque": [n for n in noms if not n.startswith("lib/")],
              "sans composant Python": [n for n in noms if not n.endswith(".py")],
              "sans Linguistic.xcu": [n for n in noms if n != "Linguistic.xcu"],
              "description seule": ["description.xml", "META-INF/manifest.xml"],
          }
          for nom, membres in variantes.items():
              d = tempfile.mkdtemp()
              oxt = os.path.join(d, "v.oxt")
              with zipfile.ZipFile(complete) as src, zipfile.ZipFile(oxt, "w") as dst:
                  for m in membres:
                      if m != "META-INF/manifest.xml":
                          dst.writestr(m, src.read(m))
                  if "META-INF/manifest.xml" in membres:
                      man = src.read("META-INF/manifest.xml").decode()
                      if not any(m.endswith(".py") for m in membres):
                          man = "\n".join(l for l in man.splitlines() if "correcteur_lo.py" not in l and "type=Python" not in l)
                      if "Linguistic.xcu" not in membres:
                          man = "\n".join(l for l in man.splitlines() if "Linguistic.xcu" not in l and "configuration-data" not in l)
                      dst.writestr("META-INF/manifest.xml", man)
              profil = pathlib.Path(tempfile.mkdtemp()).as_uri()
              env = f"-env:UserInstallation={profil}"
              subprocess.run(["soffice", "--headless", "--terminate_after_init", env], capture_output=True)
              r = subprocess.run(["unopkg", "add", "-s", env, oxt], capture_output=True, text=True)
              print(f"{nom:24} → {'OK' if r.returncode == 0 else 'ÉCHEC'} {r.stderr.strip()[:160]}", flush=True)
          PY
