name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moteur:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all
      - name: Compilation release
        run: cargo build --release
      - name: Performance (500 mots < 100 ms)
        run: cargo run --release -p correcteur-cli -- mesurer
      - name: Évaluation
        run: cargo run --release -p correcteur-cli -- evaluer

  addin-word:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: addins/word
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addins/word/package-lock.json
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests (module WebAssembly et panneau)
        run: npm test
      - name: Paquet de l'add-in
        uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: addin-word
          path: addins/word/dist

  bureau:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/bureau
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/bureau/package-lock.json
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Interface (requise par la compilation Tauri)
        run: npm run build:web
      - name: Format, lint et tests (Rust)
        working-directory: apps/bureau/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Application (paquets d'installation)
        run: npm run build
      - name: Paquets
        uses: actions/upload-artifact@v4
        with:
          name: bureau-${{ matrix.os }}
          path: apps/bureau/src-tauri/target/release/bundle

  libreoffice:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: addins/libreoffice
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      # Sous Linux, le Python du système (celui de python3-uno) : l'environnement
      # de setup-python fait planter LibreOffice à l'installation de l'extension.
      - uses: actions/setup-python@v5
        if: matrix.os != 'ubuntu-latest'
        with:
          python-version: "3.12"
      - name: Extension (.oxt)
        run: python3 construire.py
      - name: Test dans LibreOffice (sans interface)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer python3-uno libreoffice-script-provider-python
          # Python du système : il a le module uno (python3-uno) et pilote LibreOffice par socket.
          /usr/bin/python3 tests/tester.py dist/*.oxt --soffice /usr/bin/soffice
      - name: Paquet
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-${{ matrix.os }}
          path: addins/libreoffice/dist/*.oxt
