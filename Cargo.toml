[workspace]
resolver = "2"
members = ["crates/correcteur-core", "crates/correcteur-cli", "crates/correcteur-wasm", "crates/correcteur-ffi"]
# L'application Tauri a ses propres dépendances lourdes : elle est construite à part.
exclude = ["apps/bureau/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.82"

[profile.release]
lto = true
codegen-units = 1
